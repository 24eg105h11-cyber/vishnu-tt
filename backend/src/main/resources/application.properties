# Application Name & Port
spring.application.name=college-event-management
server.port=${SERVER_PORT:${PORT:8080}}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/college_event_db}}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1a3d6f8e2c5b9a4f7d1e3c8b5a2f9e6c3d0a7b4e1f8c5b2a9d6e3f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary File Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789012345}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:abcdefghijklmnopqrstuvwxyz123456}

# Spring Multipart Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# WebSocket STOMP Endpoint
app.websocket.endpoint=${WEBSOCKET_ENDPOINT:/ws}

# Logging Configuration
logging.level.com.college.eventmanagement=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

