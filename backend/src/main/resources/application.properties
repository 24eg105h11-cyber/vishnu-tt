# Application Name & Port
spring.application.name=college-event-management
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/college_event_db

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1a3d6f8e2c5b9a4f7d1e3c8b5a2f9e6c3d0a7b4e1f8c5b2a9d6e3f
app.jwt.expiration-ms=86400000

# Cloudinary File Storage Configuration
cloudinary.cloud-name=demo-cloud
cloudinary.api-key=123456789012345
